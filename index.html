function draw(){bg();if(state=='title'){title();return}drawGame();if(paused){R('rgba(0,0,0,.5)',0,0,W,H);txt('PAUSED',W/2,85,'#f2d600',16);txt('Tap or Esc to resume',W/2,105,'#fff',8)}txt('HI '+hi,W-4,22,'#ffd',7,'right')}function drawGame(){
 g.save();g.translate(-Math.round(cam),0);const x0=Math.floor(cam/T);
 for(let y=0;y<map.length;y++)for(let x=x0;x<x0+W/T+2;x++){const c=tile(x,y);if(c!=' ')drawTile(c,x*T,y*T)}
 for(const e of ents){if(e.gone)continue;if(e.t=='c'){const w=Math.abs(Math.sin(Date.now()/200))*6+2;R('#ffd700',e.x+4-w/2,e.y,w,8);R('#fff8a0',e.x+4-w/4,e.y+1,1,3)}
  else if(e.t=='r')rock(e,e.x,e.y);else if(e.t=='k')cone(e,e.x,e.y);
  else if(e.t=='j'){R('#555',e.x,e.y+2,12,9);R('#ff8c00',e.x+2,e.y+3,8,3);R('#999',e.x+1,e.y+11,3,1);R('#999',e.x+8,e.y+11,3,1);R('#ff0',e.x+5,e.y,2,2)}}
 for(const p of parts){if(p.t=='pc')R('#ffd700',p.x,p.y,8,8);else if(p.t=='d')R('#7b321b',p.x,p.y,4,4);else if(p.t=='f')R(p.l>6?'#ffcc00':'#ff5500',p.x,p.y,3,3);else if(p.t=='s')txt('200',p.x+7,p.y-(30-p.l),'#fff',7)}
 hero(P.x,P.y,P.face);
 // drone helper companion
 if(P.jet){const dx=P.x-P.face*14,dy=P.y-12+Math.sin(Date.now()/150)*2;R('#444',dx,dy+2,10,3);R('#ccc',dx-2+((Date.now()>>5)%3),dy,5,1);R('#ccc',dx+7-((Date.now()>>5)%3),dy,5,1);R('#0f0',dx+4,dy+3,2,1)}
 g.restore();
 R('rgba(0,0,0,.4)',0,0,W,13);txt('SCORE '+String(score).padStart(6,'0'),4,10,'#fff',8,'left');txt('COINS '+coins,120,10,'#ffd700',8,'left');txt('SITE '+(lvl+1)+'/3',200,10,'#fff',8,'left');txt('♥x'+Math.max(0,lives),W-4,10,'#ff8c00',8,'right');
 if(P.jet){R('#333',4,16,32,4);R('#0f0',4,16,32*P.fuel/60,4)}
 if(state=='intro'){R('rgba(0,0,0,.6)',0,0,W,H);txt(['SITE 1: GROUNDBREAKING','SITE 2: SUNSET SCAFFOLDS','SITE 3: NIGHT SHIFT'][lvl],W/2,80,'#ff8c00',12);txt('LIVES x '+lives,W/2,100)}
 if(state=='clear')txt('SITE CLEARED!',W/2,80,'#ffd700',16);
 if(state=='over'){R('rgba(0,0,0,.75)',0,0,W,H);txt('GAME OVER',W/2,75,'#e74c3c',20);txt('SCORE '+score,W/2,100);txt('TAP TO RESTART',W/2,130,'#aaa')}
 if(state=='win'){R('rgba(0,0,0,.75)',0,0,W,H);txt('ALL SITES COMPLETE!',W/2,70,'#ffd700',16);txt('Shift over, pilot. Great work!',W/2,92);txt('FINAL SCORE '+score,W/2,112,'#ff8c00',10);txt('TAP TO RESTART',W/2,140,'#aaa')}}
function title(){R('rgba(0,0,0,.35)',0,0,W,H);txt('HARD HAT',W/2,48,'#ff8c00',24);txt('HOPPER',W/2,76,'#f2d600',24);
 P=P||{inv:0,jet:1,on:0,vx:0};const sp={inv:0,jet:1,on:0,vx:0,fuel:1};const o=P;P=sp;hero(W/2-5,96+Math.sin(Date.now()/200)*3,1);P=o;
 rock({a:Date.now()/300},60,140);cone({},250,140);R('#7a5232',0,156,W,24);
 if((Date.now()>>9)%2)txt('TAP TO START',W/2,125,'#fff',9);txt('HIGH SCORE '+hi,W/2,138,'#f2d600',8);txt('Hold JUMP in air for jetpack  |  Esc pause',W/2,172,'#ddd',7)}
let last=performance.now(),acc=0;function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=16.67){update();acc-=16.67}draw();requestAnimationFrame(loop)}
if(location.hash.startsWith("#demo")){lvl=+location.hash.slice(5)||0;load(lvl);state="play";P.jet=1;P.fuel=60;for(let i=0;i<60;i++){K.ArrowRight=1;update()}K.ArrowRight=0}
setInterval(()=>music(.02),20);requestAnimationFrame(loop);
